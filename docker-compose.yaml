services:
  ollama:
    container_name: choco-coco-brain
    restart: unless-stopped
    image: ollama/ollama:0.22.1
    volumes:
      - ./run_ollama.sh:/run_ollama.sh:Z
      - ./ollama:/root/.ollama:Z
    env_file:
      - .env
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_PORT}"

    entrypoint:
      - /bin/bash
      - -c
      - |
        ollama serve &

        until ollama list > /dev/null 2>&1; do
          sleep 1
        done

        ollama pull qwen2.5:3b-instruct
        ollama pull embeddinggemma:300m

        wait

    networks:
      - ollama_network

  choco-coco-api:
    container_name: choco-coco-api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      args:
        - API_PORT=${API_PORT}
    depends_on:
      - ollama
    env_file:
      - .env
    networks:
      - ollama_network
    ports:
      - "${API_PORT}:${API_PORT}"

networks:
  ollama_network:
    driver: bridge
