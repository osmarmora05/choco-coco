[project]
name = "choco-coco-brain"
version = "0.1.0"
description = "An abstraction on LlamaIndex with predefined behavior parameters for a Pokémon ES."
readme = "README.md"
authors = [{ name = "osmarmora05", email = "osmaradrianmoracerna@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "llama-index>=0.14.21",
  "llama-index-embeddings-ollama>=0.9.0",
  "llama-index-llms-ollama>=0.10.1",
  "llama-index-readers-file>=0.6.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
